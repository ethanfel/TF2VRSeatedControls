[controls]
enabled=1
; A short press swaps on release; a hold forwards the original Y action once.
menu_hold_ms=550
; Flick right stick down to toggle crouch; A stands you up and then jumps.
toggle_crouch=1
; Brief controller vibration when a grenade or fresh magazine can be grabbed.
pickup_haptics=1

[holsters]
; Copy the secondary grab point to the right hip; the left hip still works.
; An owned Arc Tool keeps priority at the right hip.
secondary_right=1

[grenade]
; Percentage of the mod's original chest pickup radius. 100 restores its radius.
; Range: 100-250. 225 changes the verified 12 cm radius to approximately 27 cm.
pickup_radius_percent=225

[reload]
; Extra virtual magazine supply points in front. Shoulder grabs still work.
; These points have haptic feedback but no new visible pouch model.
front_pouch=1
; Position relative to the midpoint of the mod's shoulder anchors (centimetres).
pouch_forward_cm=30
pouch_drop_cm=30
pouch_radius_cm=12
; 100 restores original distance/angle tolerances. Ranges: 100-200 / 100-150.
distance_percent=150
angle_percent=125
